<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGMAD Map Explorer | GNS Science Geological Map Viewer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Esri Leaflet -->
    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- TOP TITLE HEADER -->
    <header id="app-header">
        <!-- Self-contained SVG Logo -->
        <div class="embedded-logo">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Circle Background with custom fill #452f55 -->
                <circle cx="50" cy="50" r="45" fill="#452f55"/>
                
                <!-- Bottom Layer (Green - Terrain) -->
                <path d="M25 60 L50 72 L75 60 L50 48 Z" fill="#4CAF50" stroke="#fff" stroke-width="1"/>
                <path d="M25 60 L50 72 L50 75 L25 63 Z" fill="#388E3C"/>
                <path d="M50 72 L75 60 L75 63 L50 75 Z" fill="#2E7D32"/>

                <!-- Middle Layer (Blue - Water/Features) -->
                <path d="M25 50 L50 62 L75 50 L50 38 Z" fill="#2196F3" stroke="#fff" stroke-width="1"/>
                <path d="M25 50 L50 62 L50 64 L25 52 Z" fill="#1976D2"/>
                <path d="M50 62 L75 50 L75 52 L50 64 Z" fill="#1565C0"/>

                <!-- Top Layer (Yellow/Orange - Data) -->
                <path d="M25 40 L50 52 L75 40 L50 28 Z" fill="#FFC107" stroke="#fff" stroke-width="1"/>
                <path d="M25 40 L50 52 L50 54 L25 42 Z" fill="#FFA000"/>
                <path d="M50 52 L75 40 L75 42 L50 54 Z" fill="#FF8F00"/>
            </svg>
        </div>
        
        <!-- Text Container -->
        <div class="header-text-container">
            <h1 class="header-title">RGMAD</h1>
            <h2 class="header-subtitle">Historic Geological Map Archives Explorer</h2>
        </div>
    </header>

    <!-- MAIN CONTENT WRAPPER -->
    <div id="content-wrapper">
        <!-- Map Container -->
        <div id="map-container">
            <div id="map"></div>

            <!-- Loading Indicator -->
            <div id="loading">Loading...</div>

            <!-- Floating Info/Control Panel -->
            <div class="info-panel" id="main-panel">
                <div class="panel-header">
                    <div class="header-text">
                        <h2>Map Controls</h2>
                    </div>
                    <button id="minimize-panel" class="minimize-btn" title="Minimize/Expand">▼</button>
                </div>

                <div class="panel-section">
                    <label class="section-title">Base Map</label>
                    <div class="basemap-selector">
                        <button class="basemap-btn active" onclick="setBasemap('Gray', this)">Gray</button>
                        <button class="basemap-btn" onclick="setBasemap('Imagery', this)">Imagery</button>
                        <button class="basemap-btn" onclick="setBasemap('Streets', this)">Streets</button>
                    </div>
                </div>

                <div class="panel-section search-container">
                    <label class="section-title">Search Map Sheets</label>
                    <input type="text" id="search-input" class="search-input" placeholder="Enter sheet number or title..." autocomplete="off" />
                    <div id="search-results" class="search-results"></div>
                    <button id="btn-reset" class="btn-reset"><span style="margin-right: 5px;">×</span>Clear Selection</button>
                </div>

                <div class="panel-section">
                    <label class="section-title">Layer Controls</label>
                    <div class="control-row">
                        <label class="toggle-switch">
                            <input type="checkbox" id="layer-toggle" checked>
                            <span>Map Sheet Image</span>
                        </label>
                    </div>
                    <div class="control-row">
                        <label class="toggle-switch">
                            <input type="checkbox" id="footprints-toggle" checked>
                            <span>Index/Footprints</span>
                        </label>
                    </div>
                </div>

                <div class="panel-section">
                    <label class="section-title">Map Sheet Opacity</label>
                    <div id="opacity-label" style="font-size: 12px; color: #64748b; margin-bottom: 5px;">100% Opacity</div>
                    <input type="range" id="opacity-slider" min="0" max="100" value="100" />
                </div>
            </div>

            <!-- Map Preview Panel -->
            <div class="preview-panel" id="preview-panel" style="display: none;">
                <div class="preview-header">
                    <h3>Selected Map Sheet</h3>
                    <button onclick="closePreview()" class="close-preview-btn">×</button>
                </div>
                <div class="preview-content">
                    <div id="preview-thumbnail" class="preview-thumbnail">
                        <img id="preview-img" src="" alt="Map thumbnail" style="width: 100%; height: auto; display: none;" />
                        <div id="preview-placeholder" style="text-align: center; padding: 40px; color: #94a3b8;">No preview available</div>
                    </div>
                    <div class="preview-info">
                        <div class="preview-sheet-no" id="preview-sheet-no"></div>
                        <div class="preview-title" id="preview-title"></div>
                        <button id="download-btn" class="download-btn" style="display: none;">
                            <span style="margin-right: 5px;">⬇</span> Download TIF
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Resizable Handle -->
        <div id="resize-handle" title="Drag to resize"></div>

        <!-- Attribute Table Container -->
        <div id="table-container">
            <div class="table-header">
                <h3>Attribute Table (Index Layer) <span id="table-count" style="font-weight:normal; font-size: 0.9em; color: #64748b; margin-left: 10px;"></span></h3>
                <button class="load-more-btn" onclick="loadAttributes()">Load All Records</button>
            </div>
            <div class="table-content">
                <table class="attr-table" id="attribute-table">
                    <thead id="table-head">
                        <!-- Headers will be injected via JS now -->
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="app.js"></script>
</body>
</html>
