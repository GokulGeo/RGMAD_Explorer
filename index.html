<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGMAD Map Explorer | GNS Science Geological Map Viewer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Esri Leaflet -->
    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- TOP TITLE HEADER -->
    <header id="app-header">
        <div class="embedded-logo">
            <a href="https://www.earthsciences.nz/" target="_blank" rel="noopener noreferrer" aria-label="Visit Earth Sciences New Zealand">
                <img src="Logo_Main.png" alt="RGMAD Logo" />
            </a>
        </div>
        
        <div class="header-text-container">
            <h1 class="header-title">RGMAD</h1>
            <h2 class="header-subtitle">Historic Geological Map Archives Explorer</h2>
        </div>
    </header>

    <!-- MAIN CONTENT WRAPPER -->
    <div id="content-wrapper">
        <div id="map-container">
            <div id="map"></div>

            <div id="loading">
                <div class="loading-spinner"></div>
                <div class="loading-text">Loading...</div>
            </div>
            
            <div class="map-action-buttons">
                <button id="home-btn" class="map-action-btn" title="Reset to initial extent (H)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </button>
                <button id="fullscreen-btn" class="map-action-btn" title="Toggle fullscreen (F)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                    </svg>
                </button>
            </div>
            
            <!-- Floating Info/Control Panel -->
            <div class="info-panel" id="main-panel">
                <div class="panel-header">
                    <div class="header-text">
                        <h2>Map Controls</h2>
                    </div>
                    <button id="minimize-panel" class="minimize-btn" title="Minimize/Expand">▼</button>
                </div>

                <div class="panel-section">
                    <label class="section-title">Base Map</label>
                    <div class="basemap-selector">
                        <button class="basemap-btn active" onclick="setBasemap('Gray', this)">Gray</button>
                        <button class="basemap-btn" onclick="setBasemap('Imagery', this)">Imagery</button>
                        <button class="basemap-btn" onclick="setBasemap('Streets', this)">Streets</button>
                    </div>
                </div>



                <div class="panel-section">
                    <label class="section-title">Layer Controls</label>
                    <div class="control-row">
                        <label class="toggle-switch">
                            <input type="checkbox" id="layer-toggle">
                            <span>Map Sheet Image</span>
                        </label>
                    </div>
                    <div class="control-row">
                        <label class="toggle-switch">
                            <input type="checkbox" id="footprints-toggle" checked>
                            <span>Index/Footprints</span>
                        </label>
                    </div>
                </div>

                <div class="panel-section">
                    <label class="section-title">Map Sheet Opacity</label>
                    <div id="opacity-label" style="font-size: 12px; color: #64748b; margin-bottom: 5px;">100% Opacity</div>
                    <input type="range" id="opacity-slider" min="0" max="100" value="100" />
                </div>
            </div>


        </div>

        <!-- Resizable Handle -->
        <div id="resize-handle" title="Drag to resize"></div>

        <!-- Attribute Table Container -->
        <div id="table-container">
            <div class="table-toolbar">
                <div class="table-toolbar-top">
                    <h3>Attribute Table <span id="table-count" style="font-weight:normal; font-size: 0.9em; color: #64748b; margin-left: 10px;"></span></h3>
                </div>
                <div class="table-toolbar-actions">
                    <div class="table-search-container">
                        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35"/>
                        </svg>
                        <input type="text" id="table-search-input" class="table-search-input" placeholder="Filter by title, author, year..." autocomplete="off" />
                        <button id="clear-table-filter" class="clear-filter-btn" style="display: none;" title="Clear filter">×</button>
                    </div>
                    <button id="selection-count-btn" class="selection-count-btn" style="display:none;" title="Selected sheets">
                        <span id="selection-count-label">0 selected</span>
                        <span id="selection-count-clear" class="selection-count-clear" title="Clear selection">×</span>
                    </button>
                    <button id="filter-selected-btn" class="table-action-btn" disabled title="Filter table to show only selected rows">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                        </svg>
                        <span>Filter Selected</span>
                    </button>
                    <button id="clear-filter-selected-btn" class="table-action-btn" style="display: none;" title="Clear selection filter">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                        <span>Clear Filter</span>
                    </button>
                    <button id="extent-filter-btn" class="extent-filter-btn" title="Filter table to the visible extent">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>
                        </svg>
                        <span>Filter and follow map</span>
                    </button>
                </div>
            </div>
            <div class="table-content">
                <table class="attr-table" id="attribute-table">
                    <thead id="table-head">
                        <!-- Headers will be injected via JS now -->
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Context Menu -->
        <div id="row-context-menu" class="context-menu">
            <div class="context-menu-item" id="context-zoom">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                    <path d="M11 8v6M8 11h6"/>
                </svg>
                <span>Zoom to Feature</span>
            </div>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="app.js"></script>
</body>
</html>
